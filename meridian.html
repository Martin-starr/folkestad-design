<style>
/* ============================================================
   JOURNEY ENGINE — stylesheet
   Theme is driven by CSS variables set from window.SITE.theme.
   Values below are fallbacks so the file works standalone.
   ============================================================ */
:root {
  --bg: #f4f4f1;
  --ink: #14140f;
  --muted: #8f8f86;
  --accent: #d8ff3e;
  --panel-border: rgba(20, 20, 15, 0.10);
  --font-display: 'Space Grotesk', sans-serif;
  --font-body: 'Inter', sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: var(--font-display); margin: 0; font-weight: 700; }
p { margin: 0; }
img { display: block; }

/* ---------------- Loader ---------------- */
#loader {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1.1rem;
  transition: opacity 0.9s ease, visibility 0.9s ease;
}
#loader.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
#loader-brand {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(2.4rem, 7vw, 4.5rem); letter-spacing: -0.03em;
}
#loader-hint {
  font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
}
#loader-progress {
  width: 140px; height: 2px; background: var(--panel-border); overflow: hidden; margin-top: 0.4rem;
}
#loader-progress i { display: block; height: 100%; width: 30%; background: var(--ink);
  animation: loaderslide 1.1s ease-in-out infinite; }
@keyframes loaderslide { 0%{transform:translateX(-120%)} 100%{transform:translateX(460%)} }

/* ---------------- Menu ---------------- */
#menu {
  position: fixed; top: 1.9rem; right: 2rem; z-index: 90;
  display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem;
}
.menu-item {
  display: flex; align-items: center; gap: 0.6rem;
  background: none; border: none; cursor: pointer;
  font-family: var(--font-body); font-size: 0.72rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--muted); padding: 0.2rem 0;
  transition: color 0.25s ease;
}
.menu-item:hover, .menu-item.is-active { color: var(--ink); }
.menu-index {
  font-family: var(--font-display); font-size: 0.68rem; font-weight: 500;
  width: 1.55rem; height: 1.55rem; border-radius: 50%;
  border: 1px solid var(--panel-border);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.25s ease, color 0.25s ease;
}
.menu-item.is-active .menu-index { background: var(--accent); color: var(--ink); border-color: transparent; }

/* Brand mark top-left */
#brandmark {
  position: fixed; top: 1.9rem; left: 2rem; z-index: 90;
  font-family: var(--font-display); font-weight: 700; font-size: 1rem;
  letter-spacing: 0.14em; text-transform: uppercase;
}

/* ---------------- Scroll stage ---------------- */
#app { position: fixed; inset: 0; overflow: hidden; cursor: grab; }
#app.is-dragging { cursor: grabbing; }
#track { position: absolute; top: 0; left: 0; height: 100%; display: flex; will-change: transform; }

.panel {
  position: relative; height: 100%; flex: 0 0 auto;
  width: 100vw; border-right: 1px solid var(--panel-border);
  /* overflow must stay visible: parallax layers drift past panel edges by design;
     #app clips the stage as a whole */
  overflow: visible;
}

/* ---------------- Layers ---------------- */
.layer {
  position: absolute;
  will-change: transform, opacity, filter;
  backface-visibility: hidden;
}

/* image layer */
.layer--image { overflow: visible; }
.layer--image .frame {
  width: 100%; height: 100%; overflow: hidden; background: var(--panel-border);
}
.layer--image img { width: 100%; height: 100%; object-fit: cover; }
.layer--image figcaption {
  margin-top: 0.55rem; font-size: 0.66rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted); line-height: 1.5;
}
.layer--image figcaption b { color: var(--ink); font-weight: 600; }

/* text layer */
.layer--text { display: flex; flex-direction: column; gap: 1.15rem; }
.layer--text .kicker, .tag {
  font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
}
.layer--text .title {
  font-family: var(--font-display); font-weight: 700; letter-spacing: -0.02em; line-height: 1.02;
  font-size: clamp(1.9rem, 4vw, 3.2rem);
}
.layer--text.hero .title { font-size: clamp(4rem, 12vw, 9rem); line-height: 0.9; letter-spacing: -0.04em; }
.layer--text .body { font-size: 1.05rem; line-height: 1.65; color: #3a3a34; max-width: 34rem; }
.layer--text .lead { font-size: 1.2rem; line-height: 1.6; color: var(--ink); font-weight: 400; }

.facts { display: flex; gap: 2.4rem; flex-wrap: wrap; }
.fact { display: flex; flex-direction: column; gap: 0.2rem; }
.fact .num { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; }
.fact .lab { font-size: 0.75rem; color: var(--muted); }

.cta {
  align-self: flex-start; margin-top: 0.3rem;
  font-family: var(--font-body); font-size: 0.8rem; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); text-decoration: none;
  border: 1px solid var(--ink); border-radius: 2px; padding: 0.7rem 1.3rem;
  transition: background 0.2s ease, color 0.2s ease;
}
.cta:hover { background: var(--ink); color: var(--bg); }

/* stacked-letter word */
.layer--stack {
  display: flex; flex-direction: column; align-items: center; line-height: 0.82;
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(1.5rem, 3vw, 2.6rem); letter-spacing: -0.02em;
  color: var(--panel-border); user-select: none; pointer-events: none;
}
.layer--stack.accent span { color: var(--ink); }
.layer--stack span.sp { height: 0.5em; }

/* big number marker */
.layer--bignum {
  font-family: var(--font-display); font-weight: 700; font-size: 0.85rem;
  color: var(--muted); letter-spacing: 0.05em; pointer-events: none;
}

/* ---------------- Persistent rail (timeline) ---------------- */
#rail {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 80;
  padding: 0.9rem 2rem 1.1rem;
  background: linear-gradient(to top, var(--bg) 55%, transparent);
  pointer-events: none;
}
#rail-line { position: relative; height: 1px; background: var(--panel-border); margin: 0 0 0.7rem; }
#rail-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0%; background: var(--ink); }
#rail-marker {
  position: absolute; top: 50%; left: 0%; width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); border: 1.5px solid var(--ink);
  transform: translate(-50%, -50%);
}
#rail-items { display: flex; justify-content: space-between; gap: 1rem; pointer-events: auto; }
.rail-item {
  flex: 1 1 0; display: flex; flex-direction: column; gap: 0.15rem; cursor: pointer;
  min-width: 0;
}
.rail-item .rl { font-family: var(--font-display); font-weight: 700; font-size: 0.8rem;
  letter-spacing: 0.02em; color: var(--muted); transition: color 0.25s ease; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.rail-item .rd { font-size: 0.66rem; color: var(--muted); line-height: 1.35; opacity: 0.75;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-item.is-active .rl { color: var(--ink); }
.rail-item:last-child { text-align: right; align-items: flex-end; }

/* top progress hairline */
#progress { position: fixed; left: 0; right: 0; top: 0; height: 2px; background: transparent; z-index: 85; }
#progress i { display: block; height: 100%; width: 0%; background: var(--accent); }

/* ---------------- Reduced motion ---------------- */
@media (prefers-reduced-motion: reduce) {
  .layer { filter: none !important; }
}

/* ---------------- Small screens ---------------- */
@media (max-width: 640px) {
  #brandmark { font-size: 0.85rem; }
  #menu { top: auto; bottom: 5.2rem; right: 1rem; }
  .menu-item .menu-label { display: none; }
  #rail-items .rd { display: none; }
}

</style>
</head>

      { label: "2024 — Iceland", desc: "Solo weeks in the interior, chasing meltwater and dark skies." }
    ]
  }
};

/* ============================================================
   JOURNEY ENGINE
   A config-driven horizontal-scroll "journey" renderer + engine.
   Feed it window.SITE (see content.js / TEMPLATE.md) and it builds
   the DOM, then runs scroll physics, multi-pace parallax, and
   scroll-reactive reveal (fade / blur / rise).
   No frameworks, no build step.
   ============================================================ */
(function () {
  'use strict';

  var SITE = window.SITE;
  if (!SITE) { console.error('[journey] window.SITE config missing'); return; }

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isSmall = window.matchMedia('(max-width: 640px)').matches;

  /* -------- reveal presets: how a layer reacts as it crosses center -------- */
  // hold = half-width of the "sharp zone" around screen center (fraction of vw):
  // inside it the layer is fully revealed, so text stays readable while in front
  // of the user instead of starting to blur the moment it leaves dead-center.
  var REVEAL = {
    none: { floor: 1,    band: 1,    hold: 0,    blur: 0,  rise: 0,  scale: 0 },
    fade: { floor: 0.22, band: 0.85, hold: 0.2,  blur: 0,  rise: 0,  scale: 0 },
    blur: { floor: 0.0,  band: 0.5,  hold: 0.38, blur: 11, rise: 10, scale: 0.04 },
    rise: { floor: 0.0,  band: 0.6,  hold: 0.15, blur: 0,  rise: 44, scale: 0 }
  };

  /* ============================================================
     1. THEME
     ============================================================ */
  function applyTheme(t) {
    if (!t) return;
    var root = document.documentElement.style;
    var map = {
      bg: '--bg', ink: '--ink', muted: '--muted', accent: '--accent',
      panelBorder: '--panel-border', fontDisplay: '--font-display', fontBody: '--font-body'
    };
    Object.keys(map).forEach(function (k) { if (t[k]) root.setProperty(map[k], t[k]); });
    if (t.googleFonts) {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://fonts.googleapis.com/css2?family=' + t.googleFonts + '&display=swap';
      document.head.appendChild(link);
    }
  }

  /* ============================================================
     2. RENDER (config -> DOM)
     ============================================================ */
  function el(tag, cls, styleObj) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (styleObj) Object.keys(styleObj).forEach(function (k) { n.style[k] = styleObj[k]; });
    return n;
  }

  function pos(layer) {
    var s = {};
    if (layer.x != null) s.left = layer.x;
    if (layer.y != null) s.top = layer.y;
    if (layer.w != null) s.width = layer.w;
    if (layer.h != null) s.height = layer.h;
    return s;
  }

  function tagLayer(node, layer) {
    var p = layer.parallax != null ? layer.parallax : 1;
    node.setAttribute('data-parallax', reduceMotion ? 1 : p);
    var reveal = layer.reveal || 'none';
    if (reduceMotion && reveal !== 'none') reveal = 'fade';
    node.setAttribute('data-reveal', reveal);
    if (layer.opacity != null) {
      node.setAttribute('data-opacity', layer.opacity);
      if (reveal === 'none') node.style.opacity = layer.opacity;   // static dimmed backgrounds
    }
  }

  function buildStack(word, accent) {
    var wrap = el('div', 'layer layer--stack' + (accent ? ' accent' : ''));
    word.split('').forEach(function (ch) {
      var s = document.createElement('span');
      if (ch === ' ') s.className = 'sp'; else s.textContent = ch;
      wrap.appendChild(s);
    });
    return wrap;
  }

  function buildText(layer) {
    var box = el('div', 'layer layer--text' + (layer.hero ? ' hero' : ''), pos(layer));
    if (layer.kicker) { var k = el('div', 'kicker'); k.textContent = layer.kicker; box.appendChild(k); }
    if (layer.tag) { var tg = el('div', 'tag'); tg.textContent = layer.tag; box.appendChild(tg); }
    if (layer.title) { var h = el(layer.hero ? 'h1' : 'h2', 'title'); h.textContent = layer.title; box.appendChild(h); }
    if (layer.lead) { var l = el('p', 'lead'); l.textContent = layer.lead; box.appendChild(l); }
    if (layer.body) { var b = el('p', 'body'); b.textContent = layer.body; box.appendChild(b); }
    if (layer.facts && layer.facts.length) {
      var fr = el('div', 'facts');
      layer.facts.forEach(function (f) {
        var fc = el('div', 'fact');
        var n = el('span', 'num'); n.textContent = f.num;
        var la = el('span', 'lab'); la.textContent = f.label;
        fc.appendChild(n); fc.appendChild(la); fr.appendChild(fc);
      });
      box.appendChild(fr);
    }
    if (layer.cta) {
      var a = el('a', 'cta'); a.textContent = layer.cta.label; a.href = layer.cta.href || '#';
      if (/^https?:/.test(a.href)) { a.target = '_blank'; a.rel = 'noopener'; }
      box.appendChild(a);
    }
    return box;
  }

  function buildImage(layer) {
    var fig = el('figure', 'layer layer--image', pos(layer));
    fig.style.margin = '0';
    var frame = el('div', 'frame');
    if (layer.rounded) frame.style.borderRadius = '2px';
    var img = el('img');
    img.src = layer.src; img.alt = layer.alt || '';
    // eager: horizontally-transformed panels make lazy-loading unreliable, and the
    // images ARE the content — better to load them upfront than risk blank frames.
    img.loading = 'eager'; img.decoding = 'async';
    // graceful fallback so a template never shows a broken image
    img.onerror = function () {
      if (img.dataset.fbk) return;
      img.dataset.fbk = '1';
      var seed = encodeURIComponent((layer.src || 'img').slice(-12));
      img.src = 'https://picsum.photos/seed/' + seed + '/1200/800';
    };
    frame.appendChild(img);
    fig.appendChild(frame);
    if (layer.caption) {
      var cap = el('figcaption');
      cap.innerHTML = layer.caption;
      fig.appendChild(cap);
    }
    return fig;
  }

  function buildBignum(layer) {
    var n = el('div', 'layer layer--bignum', pos(layer));
    n.textContent = layer.text;
    return n;
  }

  function render() {
    applyTheme(SITE.theme);

    document.getElementById('loader-brand').textContent = SITE.brand || '';
    if (SITE.loaderHint) document.getElementById('loader-hint').textContent = SITE.loaderHint;
    var bm = document.getElementById('brandmark');
    if (bm) bm.textContent = SITE.brand || '';

    var track = document.getElementById('track');
    var menu = document.getElementById('menu');
    track.innerHTML = ''; menu.innerHTML = '';

    (SITE.sections || []).forEach(function (sec, i) {
      // menu
      var mi = el('button', 'menu-item'); mi.dataset.panel = i;
      var idx = el('span', 'menu-index'); idx.textContent = ('0' + i).slice(-2);
      var lab = el('span', 'menu-label'); lab.textContent = sec.menu || sec.title || ('0' + i);
      mi.appendChild(idx); mi.appendChild(lab);
      menu.appendChild(mi);

      // panel
      var panel = el('section', 'panel');
      panel.id = 'panel-' + (sec.id || i);
      if (sec.width) panel.style.width = sec.width;
      (sec.layers || []).forEach(function (layer) {
        var node;
        switch (layer.type) {
          case 'image': node = buildImage(layer); break;
          case 'text':  node = buildText(layer);  break;
          case 'stack': node = buildStack(layer.text, layer.accent); node.style.left = layer.x; node.style.top = layer.y; break;
          case 'bignum': node = buildBignum(layer); break;
          default: return;
        }
        tagLayer(node, layer);
        panel.appendChild(node);
      });
      track.appendChild(panel);
    });

    // rail
    var railItems = document.getElementById('rail-items');
    railItems.innerHTML = '';
    var items = (SITE.rail && SITE.rail.items) || [];
    items.forEach(function (it, i) {
      var ri = el('div', 'rail-item'); ri.dataset.idx = i;
      var rl = el('span', 'rl'); rl.textContent = it.label;
      var rd = el('span', 'rd'); rd.textContent = it.desc || '';
      ri.appendChild(rl); ri.appendChild(rd);
      railItems.appendChild(ri);
    });
  }

  /* ============================================================
     3. ENGINE (scroll physics + parallax + reveal + rail)
     ============================================================ */
  var app, track, panels, menuItems, railItems, progressFill, railFill, railMarker, loader;
  var layers = [];            // { el, p, reveal, homeCX, halfW }
  var panelOffsets = [];
  var target = 0, eased = 0, maxX = 0, vw = window.innerWidth;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

  function collect() {
    panels = [].slice.call(track.querySelectorAll('.panel'));
    layers = [];
    var vh = window.innerHeight;
    [].forEach.call(track.querySelectorAll('.layer'), function (node) {
      var panel = node.closest('.panel');
      var homeX = panel.offsetLeft + node.offsetLeft;
      var w = node.offsetWidth || 0;
      var pAttr = parseFloat(node.getAttribute('data-parallax'));
      var opAttr = parseFloat(node.getAttribute('data-opacity'));
      var homeCX = homeX + w / 2;
      layers.push({
        el: node,
        p: isFinite(pAttr) ? pAttr : 1,          // don't clobber a legit 0 (pinned layer)
        reveal: node.getAttribute('data-reveal') || 'none',
        baseOp: isFinite(opAttr) ? opAttr : 1,
        lastBlur: -1,
        homeCX: homeCX,
        // scroll position at which this layer sits at screen center; parallax drift
        // is measured from here so a layer is always at its DESIGNED spot when in view
        anchor: homeCX - window.innerWidth / 2,
        halfW: w / 2
      });
    });
    void vh;
  }

  function measure() {
    vw = window.innerWidth;
    collect();                                    // populates `panels` — must run first
    var off = 0;
    panelOffsets = panels.map(function (pn) { var s = off; off += pn.offsetWidth; return s; });
    maxX = Math.max(0, track.scrollWidth - vw);
    target = clamp(target, 0, maxX);
    eased = clamp(eased, 0, maxX);                // keep rail/progress <=100% after shrink-resize
  }

  function activeIndex() {
    var mid = eased + vw / 2, idx = 0;
    for (var i = 0; i < panelOffsets.length; i++) if (mid >= panelOffsets[i]) idx = i;
    return idx;
  }

  function applyReveal(L, screenCX) {
    var cfg = REVEAL[L.reveal] || REVEAL.none;
    var rel = (screenCX - vw / 2) / vw;          // 0 at center, ±0.5 at edges
    var a = Math.max(Math.abs(rel) - cfg.hold, 0);   // sharp inside the hold zone
    var d = Math.min(a / cfg.band, 1);
    var t = 1 - d;                                // 1 at center -> 0 far
    t = t * t * (3 - 2 * t);                      // smoothstep
    var opacity = cfg.floor + (1 - cfg.floor) * t;
    var blur = (isSmall ? 0 : cfg.blur) * (1 - t);
    var rise = cfg.rise * (1 - t);
    var scale = 1 + cfg.scale * (1 - t);
    return { opacity: opacity, blur: blur, rise: rise, scale: scale };
  }

  function frame() {
    eased += (target - eased) * (reduceMotion ? 1 : 0.055);  // slower, heavier glide
    if (Math.abs(target - eased) < 0.06) eased = target;

    track.style.transform = 'translate3d(' + (-eased) + 'px,0,0)';

    for (var i = 0; i < layers.length; i++) {
      var L = layers[i];
      // parallax drift anchored to the layer's own home: zero when it's centered,
      // grows only with LOCAL distance — never with absolute track position
      var extraX = (eased - L.anchor) * (1 - L.p);
      var screenCX = L.homeCX - eased + extraX;       // where its center sits on screen
      var r = (L.reveal === 'none') ? null : applyReveal(L, screenCX);
      var ty = r ? r.rise : 0;
      var sc = r ? r.scale : 1;
      L.el.style.transform = 'translate3d(' + extraX.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0) scale(' + sc.toFixed(3) + ')';
      if (r) {
        L.el.style.opacity = (r.opacity * L.baseOp).toFixed(3);
        // quantize blur to 0.5px steps + write only on change (avoids per-frame re-raster)
        var qb = Math.round(r.blur * 2) / 2;
        if (qb !== L.lastBlur) {
          L.el.style.filter = qb > 0 ? ('blur(' + qb + 'px)') : '';
          L.lastBlur = qb;
        }
      }
    }

    // rail + progress
    var frac = maxX > 0 ? eased / maxX : 0;
    progressFill.style.width = (frac * 100) + '%';
    railFill.style.width = (frac * 100) + '%';
    railMarker.style.left = (frac * 100) + '%';
    var railActive = Math.round(frac * (railItems.length - 1));
    for (var j = 0; j < railItems.length; j++) railItems[j].classList.toggle('is-active', j === railActive);

    var ai = activeIndex();
    for (var m = 0; m < menuItems.length; m++) menuItems[m].classList.toggle('is-active', m === ai);

    requestAnimationFrame(frame);
  }

  /* -------- input -------- */
  function bindInput() {
    window.addEventListener('wheel', function (e) {
      e.preventDefault();
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (e.deltaMode === 1) d *= 16;        // Firefox line-mode wheel → px
      else if (e.deltaMode === 2) d *= vw;   // page-mode → px
      target = clamp(target + d * 0.85, 0, maxX);  // gentler travel per wheel tick
    }, { passive: false });

    var dragging = false, startX = 0, startTarget = 0;
    app.addEventListener('pointerdown', function (e) {
      dragging = true; startX = e.clientX; startTarget = target;
      app.setPointerCapture(e.pointerId); app.classList.add('is-dragging');
    });
    app.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      target = clamp(startTarget - (e.clientX - startX) * 1.15, 0, maxX);
    });
    function up() { dragging = false; app.classList.remove('is-dragging'); }
    app.addEventListener('pointerup', up);
    app.addEventListener('pointercancel', up);

    window.addEventListener('keydown', function (e) {
      var step = vw * 0.85;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'PageDown') target = clamp(target + step, 0, maxX);
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') target = clamp(target - step, 0, maxX);
      else if (e.key === 'Home') target = 0;
      else if (e.key === 'End') target = maxX;
    });

    menuItems.forEach(function (mi, i) {
      mi.addEventListener('click', function () { target = clamp(panelOffsets[i], 0, maxX); });
    });
    railItems.forEach(function (ri, i) {
      ri.addEventListener('click', function () {
        var frac = railItems.length > 1 ? i / (railItems.length - 1) : 0;
        target = clamp(frac * maxX, 0, maxX);
      });
    });
  }

  /* -------- loader -------- */
  function hideLoader() { loader.classList.add('is-hidden'); }

  /* -------- boot -------- */
  function boot() {
    render();

    app = document.getElementById('app');
    track = document.getElementById('track');
    menuItems = [].slice.call(document.querySelectorAll('.menu-item'));
    railItems = [].slice.call(document.querySelectorAll('.rail-item'));
    progressFill = document.querySelector('#progress i');
    railFill = document.getElementById('rail-fill');
    railMarker = document.getElementById('rail-marker');
    loader = document.getElementById('loader');

    measure();
    bindInput();
    window.addEventListener('resize', function () {
      isSmall = window.matchMedia('(max-width: 640px)').matches;
      measure();
    });
    // re-measure once images have real sizes
    window.addEventListener('load', measure);

    requestAnimationFrame(frame);

    var done = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    Promise.all([done, new Promise(function (r) {
      if (document.readyState === 'complete') r(); else window.addEventListener('load', r);
    })]).then(function () { measure(); setTimeout(hideLoader, 400); });
    setTimeout(hideLoader, 3000); // safety net
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
